name: DDC PR Proof

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: proof
        uses: altrudev/PR-Proof@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-comment: "true"
          fail-on: "never"

      - name: Validate proof outputs
        shell: bash
        run: |
          test -n "${{ steps.proof.outputs.verdict }}"
          test -n "${{ steps.proof.outputs.surprise-score }}"
          test -n "${{ steps.proof.outputs.intent-alignment }}"
          test -f "${{ steps.proof.outputs.proof-file }}"
